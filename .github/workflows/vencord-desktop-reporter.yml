name: Vencord Desktop Reporter

on:
  push:
    branches:
      - main
    paths:
      - "Dockerfile.reporter"
      - "reporter-entrypoint.sh"
      - ".github/workflows/vencord-desktop-reporter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop-reporter:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build reporter image
        run: docker build -f Dockerfile.reporter -t discord-vencord-reporter .

      - name: Run desktop reporter
        shell: bash
        run: |
          set +e
          docker run --name vencord-reporter --shm-size=512m discord-vencord-reporter 2>&1 | tee desktop-reporter.log
          status=${PIPESTATUS[0]}
          echo "Reporter exit code: $status"
          exit "$status"

      - name: Upload desktop reporter log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vencord-desktop-reporter-log
          path: desktop-reporter.log
          if-no-files-found: warn
