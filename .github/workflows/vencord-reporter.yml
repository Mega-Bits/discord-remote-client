name: Vencord Patch Reporter

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/vencord-reporter.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Vencord
        uses: actions/checkout@v4
        with:
          repository: Vendicated/Vencord
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Vencord reporter
        run: pnpm buildReporter

      - name: Run reporter against Discord Stable
        id: reporter
        shell: bash
        run: |
          set +e
          export PATH="$PWD/node_modules/.bin:$PATH"
          export CHROMIUM_BIN=/usr/bin/google-chrome

          esbuild scripts/generateReport.ts > dist/report.mjs
          node dist/report.mjs | tee vencord-report.md
          status=${PIPESTATUS[0]}

          cat vencord-report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vencord-stable-report
          path: vencord-report.md
          if-no-files-found: warn
