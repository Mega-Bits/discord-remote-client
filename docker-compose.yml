services:
  discord:
    image: ghcr.io/mega-bits/discord-remote-client:latest
    container_name: discord-remote-client
    restart: unless-stopped
    shm_size: "512m"

    environment:
      TZ: "${TZ:-Europe/Berlin}"
      RDP_PASSWORD: "${RDP_PASSWORD:-changeme}"
      RDP_MAX_BPP: "${RDP_MAX_BPP:-16}"
      VESKTOP_RESTART_DELAY: "${VESKTOP_RESTART_DELAY:-2}"

    volumes:
      - discord_config:/home/discord/.config

    ports:
      - "127.0.0.1:3389:3389"

volumes:
  discord_config:
